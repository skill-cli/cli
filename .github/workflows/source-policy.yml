name: Source policy

on:
  push:
    branches: ['**']
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    permissions:
      contents: read
    uses: agents-tools/github-workflows/.github/workflows/policy.yml@3fb2887e2831d9d5a287af73819e2ba3a39d0045
    with:
      allow-terms: |
        ChatGPT
        Claude
        Codex
        Cursor
      dependabot-exception: true
