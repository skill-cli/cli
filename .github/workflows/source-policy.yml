name: Source policy

on:
  push:
    branches: ['**']
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    permissions:
      contents: read
    uses: agents-tools/.github/.github/workflows/policy.yml@1dd5eae4c47bb6063b951066989aa6c46703b946 # v0.1.0
