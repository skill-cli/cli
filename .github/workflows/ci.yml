name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift:
    name: Swift skill CLI
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Toolchain
        run: |
          swift --version
          xcrun swift-format --version

      - name: Format
        run: xcrun swift-format lint --strict --configuration .swift-format --recursive Package.swift Sources Tests

      - name: Release Build
        run: swift build -c release

      - name: Test
        run: env -u CODEX_HOME -u CLAUDE_CONFIG_DIR -u XDG_CONFIG_HOME -u XDG_STATE_HOME -u XDG_CACHE_HOME swift test

      - name: Executable Smoke Checks
        run: |
          python3 - <<'PY'
          import pathlib
          import subprocess
          import tempfile

          executable = pathlib.Path('.build/release/skill').resolve()
          with tempfile.TemporaryDirectory(prefix='skill-smoke-') as root:
              env = {
                  'HOME': root,
                  'TMPDIR': root,
                  'PATH': '/usr/bin:/bin:/usr/sbin:/sbin',
                  'GIT_CONFIG_NOSYSTEM': '1',
                  'GIT_CONFIG_GLOBAL': '/dev/null',
                  'GIT_TERMINAL_PROMPT': '0',
              }
              for arguments in [['--help'], ['add', '--help'], ['list', '--help'], ['remove', '--help'],
                                ['update', '--help'], ['init', '--help'], ['install', '--help'],
                                ['doctor', '--help']]:
                  result = subprocess.run([str(executable), *arguments], cwd=root, env=env,
                                          capture_output=True, text=True, check=True)
                  assert 'USAGE:' in result.stdout and not result.stderr, result
                  print(result.stdout)
              for arguments in [['unknown'], ['unknown', '--help'], ['help', 'unknown']]:
                  result = subprocess.run([str(executable), *arguments], cwd=root, env=env,
                                          capture_output=True, text=True)
                  assert result.returncode == 64 and not result.stdout, result
                  assert result.stderr.startswith('Error:'), result
                  print(result.stderr)
          PY

      - name: Diff Check
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: git diff --check "$BASE_SHA" HEAD
