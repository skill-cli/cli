name: CI

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    permissions:
      contents: read
      actions: read
    uses: agents-tools/github-workflows/.github/workflows/swift-package.yml@87c58dfb79f9ad7b15ddbcf7ac0d4b422d89faa1
