name: CI

on:
  push:
    branches: ['**']
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    permissions:
      contents: read
    uses: agents-tools/.github/.github/workflows/swift-package-ci.yml@d88103a9a576c9cfe9561a5d58c803255fea72f4 # v0.1.0
    with:
      runner: macos-26
      package-directory: .
      format-configuration: .swift-format

  smoke:
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Release Build
        run: swift build -c release

      - name: Upload Executable
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: executable
          path: .build/release/skill
          if-no-files-found: error

      - name: Executable Smoke Checks
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib
          import re
          import subprocess
          import tempfile

          executable = pathlib.Path('.build/release/skill').resolve()
          entry_point = pathlib.Path('Sources/CLI/EntryPoint.swift').read_text()
          version = re.search(r'static let version = "([^"]+)"', entry_point).group(1)
          with tempfile.TemporaryDirectory(prefix='skill-smoke-') as root:
              env = {
                  'HOME': root,
                  'TMPDIR': root,
                  'PATH': '/usr/bin:/bin:/usr/sbin:/sbin',
                  'GIT_CONFIG_NOSYSTEM': '1',
                  'GIT_CONFIG_GLOBAL': '/dev/null',
                  'GIT_TERMINAL_PROMPT': '0',
              }
              for arguments in [['--help'], ['add', '--help'], ['list', '--help'], ['remove', '--help'],
                                ['update', '--help'], ['init', '--help'], ['install', '--help'],
                                ['doctor', '--help']]:
                  result = subprocess.run([str(executable), *arguments], cwd=root, env=env,
                                          capture_output=True, text=True, check=True)
                  assert 'USAGE:' in result.stdout and not result.stderr, result
                  print(result.stdout)
              result = subprocess.run([str(executable), '--version'], cwd=root, env=env,
                                      capture_output=True, text=True, check=True)
              assert result.stdout == f'skill {version}\n' and not result.stderr, result
              print(result.stdout)
              for arguments in [['unknown'], ['unknown', '--help'], ['help', 'unknown']]:
                  result = subprocess.run([str(executable), *arguments], cwd=root, env=env,
                                          capture_output=True, text=True)
                  assert result.returncode == 64 and not result.stdout, result
                  assert result.stderr.startswith('Error:'), result
                  print(result.stderr)
          PY

  presentation:
    needs: smoke
    permissions:
      contents: read
    uses: skill-cli/.github/.github/workflows/presentation.yml@6ab01dbef831e87aff43be2abdf841357920cb34 # v0.1.0
    with:
      runner: macos-26
      executable-artifact: executable
      executable-path: skill
