name: CI

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    permissions:
      contents: read
      actions: read
    uses: agents-tools/github-workflows/.github/workflows/swift-package.yml@ebd6af9164232217e2e243da0d9735544ae3a8f9
