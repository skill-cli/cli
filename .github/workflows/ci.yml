name: CI

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    permissions:
      contents: read
      actions: read
    uses: agents-tools/github-workflows/.github/workflows/swift-package.yml@3fb2887e2831d9d5a287af73819e2ba3a39d0045
